<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exchange Flight Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h1>✈️ Exchange Flight Assistant</h1>
            <p>Plan smarter for your exchange</p>
        </div>

        <div class="chat-box" id="chat-box">

            <div class="message bot-message">
                Hi! 👋 I'm your Exchange Flight Assistant.
                Ask me about flight prices, travel dates, weather or flight information.
            </div>

        </div>

        <div class="input-area">
            <input
                type="text"
                id="user-input"
                placeholder="Ask me something..."
            >

            <button id="send-button">Send</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
