<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exchange Flight Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <!-- Main chatbot container -->
    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h1>✈️ Exchange Flight Assistant</h1>
            <p>Plan smarter for your exchange</p>

            <!-- Student or staff: changes which NTU travel rules apply -->
            <label class="user-type">
                I am:
                <select id="user-type">
                    <option value="student">Student</option>
                    <option value="staff">Staff / Faculty</option>
                </select>
            </label>
        </div>


        <!-- Chat messages -->
        <div class="chat-box" id="chat-box">

            <div class="message bot-message">
                Hi! 👋 I'm your Exchange Flight Assistant.
                Ask me when to book flights, where seniors stayed,
                what exchange costs, which modules you can take,
                whether you're eligible, or what the weather is like.
            </div>

        </div>


        <!-- Message input -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask about flights, prices or weather..."
            >

            <!-- Voice input -->
            <button
                id="mic-button"
                type="button"
                title="Voice input"
            >
                🎤
            </button>

            <!-- Send message -->
            <button
                id="send-button"
                type="button"
            >
                Send
            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
